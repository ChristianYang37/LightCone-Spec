[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lightcone-spec"
version = "1.0.0"
description = "Direct research runner for LightCone-Spec experiments."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-LightCone-Source-Available-1.0 AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/Apache-2.0.txt"]
authors = [{ name = "LightCone contributors" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
gpu = ["torch>=2.6", "datasets>=2.16"]
dev = ["pytest>=7.4", "ruff>=0.8"]

[project.scripts]
lightcone-spec = "lightcone_spec.cli:main"
preview-benchmark = "lightcone_spec.preview_benchmark_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
