name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/quality/check_public_tree.py
      - run: python scripts/quality/check_git_history_secrets.py
