name: gpu-and-upstream-canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  single-gpu-contracts:
    runs-on: [self-hosted, linux, x64, nvidia, lightcone-two-gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.1
      - run: uv sync --frozen --extra dev --extra gpu
      - run: git clone --filter=blob:none https://github.com/sgl-project/sglang.git "$RUNNER_TEMP/sglang"
      - run: git -C "$RUNNER_TEMP/sglang" checkout --detach 3312645a307453893a00778592f105581e3d1c3d
      - run: uv run python scripts/verify_sglang_patchset.py --upstream-checkout "$RUNNER_TEMP/sglang"
      - name: Require and run real CUDA contracts
        shell: bash
        run: |
          count="$(uv run pytest --collect-only -q -m gpu | grep -Ec 'test_|<Function' || true)"
          test "$count" -gt 0
          LIGHTCONE_SGLANG_CHECKOUT="$RUNNER_TEMP/sglang" uv run pytest -q -m gpu

  two-gpu-system-contracts:
    runs-on: [self-hosted, linux, x64, nvidia, lightcone-two-gpu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.1
      - run: uv sync --frozen --extra dev --extra gpu
      - name: Require two declared devices and nonempty system contracts
        shell: bash
        run: |
          test "$(nvidia-smi --query-gpu=uuid --format=csv,noheader | wc -l)" -eq 2
          count="$(uv run pytest --collect-only -q -m system | grep -Ec 'test_|<Function' || true)"
          test "$count" -gt 0
          uv run pytest -q -m system

  upstream-rebase-canary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.1
      - run: uv sync --frozen --extra dev
      - run: git clone --depth=1 https://github.com/sgl-project/sglang.git "$RUNNER_TEMP/sglang-head"
      - name: Apply the semantic mail patch to current upstream as a canary
        shell: bash
        run: |
          git -C "$RUNNER_TEMP/sglang-head" config user.name lightcone-canary
          git -C "$RUNNER_TEMP/sglang-head" config user.email canary@example.invalid
          git -C "$RUNNER_TEMP/sglang-head" am --3way "$GITHUB_WORKSPACE"/patches/sglang/*.patch
          python -m compileall -q "$RUNNER_TEMP/sglang-head/python/sglang"
