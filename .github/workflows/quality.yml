name: quality

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts/gpu_acceptance.py
      - run: pytest -q tests/test_protocol.py tests/test_resume.py tests/test_metrics.py tests/test_fake_sglang.py
      - run: lightcone-spec --help
      - run: lightcone-spec plan --config "$PWD/examples/paper.yaml"
