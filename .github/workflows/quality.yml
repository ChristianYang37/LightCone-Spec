name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -c .github/constraints.txt 'torch==2.11.0+cpu' --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pip install -c .github/constraints.txt -e '.[dev]'
      - run: ruff check src tests scripts
      - run: pytest -q tests/test_protocol.py tests/test_resume.py tests/test_metrics.py tests/test_fake_sglang.py
      - run: lightcone-spec --help
      - run: |
          sed 's#/root/#/tmp/lightcone/#g' examples/paper.yaml > /tmp/paper.yaml
          lightcone-spec plan --config /tmp/paper.yaml
      - run: python scripts/check_public_package.py
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python -c 'import os,re; assert re.match(r"^(feat|fix|test|docs|chore|refactor|perf|build|ci)(\([a-zA-Z0-9_-]+\))?!?: .+", os.environ["PR_TITLE"]), "Use a Conventional Commit PR title"'
  patched-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sgl-project/sglang
          ref: 3312645a307453893a00778592f105581e3d1c3d
          path: _sglang
          persist-credentials: false
      - run: python scripts/check_sglang_patches.py --root _sglang
  live-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npm install --no-save --ignore-scripts playwright@1.55.0
      - run: npx --no-install playwright install --with-deps chromium
      - run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Synthetic UI and actual local frame capture
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" \
          PREVIEW_CAPTURE_TEST_DIRECTORY="$RUNNER_TEMP/preview-SYNTHETIC-capture" \
          node scripts/test_preview_ui.cjs
