name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.12.1
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts
      - name: Run CPU tests
        shell: bash
        run: |
          set +e
          uv run pytest -q >"$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pytest.log"
          if [[ "$status" -ne 0 ]]; then
            diagnostic="$(tail -c 6000 "$RUNNER_TEMP/pytest.log")"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=CPU test failure::$diagnostic"
          fi
          exit "$status"
      - run: uv run python -m compileall -q src scripts tests
      - run: uv run python scripts/quality/check_public_tree.py
      - run: uv run python scripts/quality/check_installed_licenses.py --output "$RUNNER_TEMP/licenses-dev.json"
      - name: Validate release licenses, generate SBOM, and audit dependencies
        shell: bash
        run: |
          uv export --quiet --frozen --extra gpu --no-emit-project --no-header --output-file "$RUNNER_TEMP/release-requirements.txt"
          uv venv --python .venv/bin/python "$RUNNER_TEMP/release-license-env"
          uv pip install --require-hashes --python "$RUNNER_TEMP/release-license-env/bin/python" --requirement "$RUNNER_TEMP/release-requirements.txt"
          "$RUNNER_TEMP/release-license-env/bin/python" scripts/quality/check_installed_licenses.py --output "$RUNNER_TEMP/licenses-release.json"
          set +e
          uv run pip-audit --requirement "$RUNNER_TEMP/release-requirements.txt" --disable-pip --strict --progress-spinner off
          audit_status=$?
          set -e
          uv export --quiet --frozen --all-extras --format cyclonedx1.5 --output-file "$RUNNER_TEMP/lightcone-spec.cdx.json"
          python -m json.tool "$RUNNER_TEMP/lightcone-spec.cdx.json" >/dev/null
          sha256sum "$RUNNER_TEMP/licenses-dev.json" "$RUNNER_TEMP/licenses-release.json" "$RUNNER_TEMP/lightcone-spec.cdx.json"
          exit "$audit_status"
      - run: git diff --check
      - name: Build twice reproducibly
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv run python -m build --outdir "$RUNNER_TEMP/dist-a"
          uv run python -m build --outdir "$RUNNER_TEMP/dist-b"
          uv run python scripts/quality/normalize_sdist.py "$RUNNER_TEMP/dist-a"/*.tar.gz
          uv run python scripts/quality/normalize_sdist.py "$RUNNER_TEMP/dist-b"/*.tar.gz
          sha256sum "$RUNNER_TEMP/dist-a"/* | sed "s#$RUNNER_TEMP/dist-a/##" > "$RUNNER_TEMP/a.sha256"
          sha256sum "$RUNNER_TEMP/dist-b"/* | sed "s#$RUNNER_TEMP/dist-b/##" > "$RUNNER_TEMP/b.sha256"
          diff -u "$RUNNER_TEMP/a.sha256" "$RUNNER_TEMP/b.sha256"
          mkdir dist
          cp "$RUNNER_TEMP/dist-a"/* dist/
      - run: uv run python -m twine check dist/*
      - name: Install wheel and smoke-test CLI
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/lightcone-spec" --help
      - name: Install sdist and smoke-test CLI
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-env/bin/lightcone-spec" --help

  patch-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.12.1
      - run: uv sync --frozen --extra dev
      - run: git clone --filter=blob:none https://github.com/sgl-project/sglang.git sglang
      - run: git -C sglang checkout --detach 3312645a307453893a00778592f105581e3d1c3d
      - run: uv run python scripts/verify_sglang_patchset.py --upstream-checkout sglang
      - run: bash -n patches/sglang/apply.sh
      - run: git -C sglang diff --exit-code
