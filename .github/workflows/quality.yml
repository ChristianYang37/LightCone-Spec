name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - name: Run CPU tests
        shell: bash
        run: |
          set +e
          pytest -q >"$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pytest.log"
          if [[ "$status" -ne 0 ]]; then
            diagnostic="$(tail -c 6000 "$RUNNER_TEMP/pytest.log")"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=CPU test failure::$diagnostic"
          fi
          exit "$status"
      - run: python -m compileall -q src scripts tests
      - run: python scripts/quality/check_public_tree.py
      - run: git diff --check
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel and smoke-test CLI
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/lightcone-spec" --help
      - name: Install sdist and smoke-test CLI
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-env/bin/lightcone-spec" --help

  patch-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git clone --filter=blob:none https://github.com/sgl-project/sglang.git sglang
      - run: git -C sglang checkout --detach 3312645a307453893a00778592f105581e3d1c3d
      - run: python scripts/verify_sglang_patchset.py --upstream-checkout sglang --compile-only
      - run: bash -n patches/sglang/apply.sh
      - run: git -C sglang diff --exit-code
